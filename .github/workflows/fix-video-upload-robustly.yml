name: Fix TrendDrop video upload robustly

on:
  push:
    paths:
      - '.github/workflows/fix-video-upload-robustly.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch upload logic only
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {n} for {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # Viral Brain: keep original DOM/UI structure; only harden file recognition/upload.
          replace_once('viral-brain.html',
            "  const ALLOWED_TYPES = new Set(['video/mp4','video/quicktime','video/webm']);\n\n  function useVideoFile(file){\n    if(!ALLOWED_TYPES.has(file.type)){\n      showToast('Please choose an MP4, MOV, or WebM file'); return;\n    }",
            "  const ALLOWED_TYPES = new Set(['video/mp4','video/quicktime','video/webm']);\n  const VIDEO_MIME_BY_EXT = {mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm'};\n\n  function normalizeVideoMime(file){\n    const type = String(file && file.type || '').toLowerCase();\n    if(ALLOWED_TYPES.has(type)) return type;\n    const name = String(file && file.name || '');\n    const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';\n    return VIDEO_MIME_BY_EXT[ext] || '';\n  }\n\n  function uploadGeminiFile(uploadUrl, file, mimeType){\n    return new Promise((resolve,reject) => {\n      const xhr = new XMLHttpRequest();\n      xhr.open('POST', uploadUrl, true);\n      xhr.setRequestHeader('Content-Type', mimeType);\n      xhr.setRequestHeader('X-Goog-Upload-Offset', '0');\n      xhr.setRequestHeader('X-Goog-Upload-Command', 'upload, finalize');\n      xhr.timeout = 180000;\n      xhr.onload = () => {\n        let data = null;\n        try{ data = JSON.parse(xhr.responseText || '{}'); }catch{}\n        if(xhr.status >= 200 && xhr.status < 300) resolve(data || {});\n        else reject(new Error(`Video upload failed (HTTP ${xhr.status || 'unknown'}).`));\n      };\n      xhr.onerror = () => reject(new Error('The browser could not send the video to the AI provider. Check the connection and try again.'));\n      xhr.ontimeout = () => reject(new Error('The video upload timed out. Try a smaller file or a faster connection.'));\n      xhr.send(file);\n    });\n  }\n\n  function useVideoFile(file){\n    if(!normalizeVideoMime(file)){\n      showToast('Please choose an MP4, MOV, WebM, or M4V file'); return;\n    }")
          replace_once('viral-brain.html', 'if(videoDuration && videoDuration > 90){', 'if(videoDuration && videoDuration > 180){')
          replace_once('viral-brain.html', 'Video AI supports up to 90s. Trim it and re-upload.', 'Video AI supports up to 3 minutes. Trim it and re-upload.')
          replace_once('viral-brain.html', 'too long, max 90s', 'too long, max 3 min')
          replace_once('viral-brain.html', 'MP4, MOV or WebM · up to 90 seconds', 'MP4, MOV or WebM · up to 3 minutes')
          replace_once('viral-brain.html', 'accept="video/mp4,video/quicktime,video/webm,video/*"', 'accept="video/*,.mp4,.mov,.webm,.m4v"')
          replace_once('viral-brain.html',
            "      const initRes = await fetch('/api/video-upload-init',{\n        method:'POST',\n        headers:{'Content-Type':'application/json'},\n        body:JSON.stringify({fileSizeBytes:videoFile.size, mimeType:videoFile.type, displayName:videoFile.name})\n      });",
            "      const uploadMimeType = normalizeVideoMime(videoFile);\n      const initRes = await fetch('/api/video-upload-init',{\n        method:'POST',\n        headers:{'Content-Type':'application/json'},\n        body:JSON.stringify({fileSizeBytes:videoFile.size, mimeType:uploadMimeType, displayName:videoFile.name})\n      });")
          replace_once('viral-brain.html',
            "      const uploadRes = await fetch(initData.uploadUrl, {\n        method: 'POST',\n        headers: {\n          'X-Goog-Upload-Offset': '0',\n          'X-Goog-Upload-Command': 'upload, finalize'\n        },\n        body: videoFile\n      });\n      if(!uploadRes.ok) throw new Error('The video upload failed partway through.');\n      const uploaded = await uploadRes.json();\n      const fileUri = uploaded?.file?.uri;\n      const mimeType = uploaded?.file?.mimeType || videoFile.type;",
            "      const uploaded = await uploadGeminiFile(initData.uploadUrl, videoFile, uploadMimeType);\n      const fileUri = uploaded?.file?.uri;\n      const mimeType = uploaded?.file?.mimeType || uploadMimeType;")

          # Meme Remix: same browser-safe upload logic, no markup restructuring.
          replace_once('js/meme-remix-app.js',
            "const ALLOWED_TYPES = new Set(['video/mp4', 'video/quicktime', 'video/webm']);",
            "const ALLOWED_TYPES = new Set(['video/mp4', 'video/quicktime', 'video/webm']);\nconst VIDEO_MIME_BY_EXT = { mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm' };\n\nfunction normalizeVideoMime(file) {\n  const type = String(file?.type || '').toLowerCase();\n  if (ALLOWED_TYPES.has(type)) return type;\n  const name = String(file?.name || '');\n  const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';\n  return VIDEO_MIME_BY_EXT[ext] || '';\n}\n\nfunction uploadGeminiFile(uploadUrl, file, mimeType) {\n  return new Promise((resolve, reject) => {\n    const xhr = new XMLHttpRequest();\n    xhr.open('POST', uploadUrl, true);\n    xhr.setRequestHeader('Content-Type', mimeType);\n    xhr.setRequestHeader('X-Goog-Upload-Offset', '0');\n    xhr.setRequestHeader('X-Goog-Upload-Command', 'upload, finalize');\n    xhr.timeout = 180000;\n    xhr.onload = () => {\n      let data = null;\n      try { data = JSON.parse(xhr.responseText || '{}'); } catch {}\n      if (xhr.status >= 200 && xhr.status < 300) resolve(data || {});\n      else reject(new Error(`Video upload failed (HTTP ${xhr.status || 'unknown'}).`));\n    };\n    xhr.onerror = () => reject(new Error('The browser could not send the video to the AI provider. Check the connection and try again.'));\n    xhr.ontimeout = () => reject(new Error('The video upload timed out. Try a smaller file or a faster connection.'));\n    xhr.send(file);\n  });\n}")
          replace_once('js/meme-remix-app.js',
            "  if (!ALLOWED_TYPES.has(file.type)) { showToast('Please choose an MP4, MOV, or WebM file'); return; }",
            "  if (!normalizeVideoMime(file)) { showToast('Please choose an MP4, MOV, WebM, or M4V file'); return; }")
          replace_once('js/meme-remix-app.js', 'if (duration && duration > 90) {', 'if (duration && duration > 180) {')
          replace_once('js/meme-remix-app.js', 'Meme Remix supports up to 90s. Trim it and re-upload.', 'Meme Remix supports up to 3 minutes. Trim it and re-upload.')
          replace_once('js/meme-remix-app.js', 'too long, max 90s', 'too long, max 3 min')
          replace_once('js/meme-remix-app.js',
            "    const initRes = await fetch('/api/video-upload-init', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ fileSizeBytes: videoFile.size, mimeType: videoFile.type, displayName: videoFile.name }),\n    });",
            "    const uploadMimeType = normalizeVideoMime(videoFile);\n    const initRes = await fetch('/api/video-upload-init', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ fileSizeBytes: videoFile.size, mimeType: uploadMimeType, displayName: videoFile.name }),\n    });")
          replace_once('js/meme-remix-app.js',
            "    const uploadRes = await fetch(initData.uploadUrl, {\n      method: 'POST',\n      headers: {\n        'X-Goog-Upload-Offset': '0',\n        'X-Goog-Upload-Command': 'upload, finalize',\n      },\n      body: videoFile,\n    });\n    if (!uploadRes.ok) throw new Error('The video upload failed partway through.');\n    const uploaded = await uploadRes.json();\n    const fileUri = uploaded?.file?.uri;\n    const mimeType = uploaded?.file?.mimeType || videoFile.type;",
            "    const uploaded = await uploadGeminiFile(initData.uploadUrl, videoFile, uploadMimeType);\n    const fileUri = uploaded?.file?.uri;\n    const mimeType = uploaded?.file?.mimeType || uploadMimeType;")

          replace_once('meme-remix.html', 'MP4, MOV or WebM · up to 90 seconds', 'MP4, MOV or WebM · up to 3 minutes')
          replace_once('meme-remix.html', 'accept="video/mp4,video/quicktime,video/webm,video/*"', 'accept="video/*,.mp4,.mov,.webm,.m4v"')

          # Backend MIME fallback for Windows/Firefox files that report blank or odd MIME types.
          replace_once('api/video-upload-init.js',
            "  const mimeType = String(body.mimeType || '');\n  const displayName = String(body.displayName || 'trenddrop-upload').slice(0, 80).replace(/[^\\w.\\- ]/g, '_');",
            "  const requestedMimeType = String(body.mimeType || '').toLowerCase();\n  const displayName = String(body.displayName || 'trenddrop-upload').slice(0, 80).replace(/[^\\w.\\- ]/g, '_');\n  const ext = displayName.includes('.') ? displayName.split('.').pop().toLowerCase() : '';\n  const mimeType = ALLOWED_MIME.has(requestedMimeType)\n    ? requestedMimeType\n    : ({ mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm' }[ext] || '');")
          replace_once('api/video-upload-init.js', 'duration is the real gate, enforced client-side (<=90s)', 'duration is the real gate, enforced client-side (<=180s)')

          # Remove temporary diagnostics / redeploy marker from the real product commit.
          for extra in ['api/debug-upload-cors.js', 'api/_debug-upload-cors.js', '.vercel-redeploy']:
              p = Path(extra)
              if p.exists(): p.unlink()

      - name: Syntax checks
        run: |
          node --check api/video-upload-init.js
          node --check js/meme-remix-app.js
          python - <<'PY'
          from pathlib import Path
          s = Path('viral-brain.html').read_text()
          start = s.rfind('<script>')
          end = s.rfind('</script>')
          assert start != -1 and end > start
          Path('/tmp/viral-brain-inline.js').write_text(s[start+8:end])
          PY
          node --check /tmp/viral-brain-inline.js
          grep -q "up to 3 minutes" viral-brain.html
          grep -q "up to 3 minutes" meme-remix.html
          grep -q "uploadGeminiFile" viral-brain.html
          grep -q "uploadGeminiFile" js/meme-remix-app.js

      - name: Commit fix
        run: |
          git config user.name "TrendDrop Upload Fix"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Fix video uploads without changing TrendDrop UI"
          git push origin HEAD:main
