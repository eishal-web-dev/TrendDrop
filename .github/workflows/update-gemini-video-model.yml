name: Update TrendDrop Gemini video model

on:
  push:
    paths:
      - '.github/workflows/update-gemini-video-model.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update model
        shell: python
        run: |
          from pathlib import Path
          p = Path('api/video-analyze.js')
          s = p.read_text()
          old = "const MODEL = 'gemini-2.5-flash';"
          new = "const MODEL = process.env.GEMINI_VIDEO_MODEL || 'gemini-3.6-flash';"
          if old not in s:
              raise SystemExit('Expected old Gemini model declaration not found')
          p.write_text(s.replace(old, new, 1))

      - name: Verify
        run: |
          node --check api/video-analyze.js
          grep -q "gemini-3.6-flash" api/video-analyze.js
          ! grep -q "gemini-2.5-flash" api/video-analyze.js

      - name: Commit update
        run: |
          git config user.name "TrendDrop Model Update"
          git config user.email "actions@github.com"
          git add api/video-analyze.js
          git commit -m "Update video analysis to Gemini 3.6 Flash"
          git push origin HEAD:main
