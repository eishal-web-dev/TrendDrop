name: Fix Meme Remix module export

on:
  push:
    paths:
      - '.github/workflows/fix-meme-module-export.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Export Meme Remix pipeline functions
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/meme-pipeline.js')
          s = p.read_text()
          export_line = "export { renderMemeRemix, loadFFmpeg, detectSilence };"
          if export_line not in s:
              s = s.rstrip() + "\n\n" + export_line + "\n"
              p.write_text(s)

      - name: Verify module export
        run: |
          grep -q "export { renderMemeRemix, loadFFmpeg, detectSilence };" js/meme-pipeline.js
          grep -q "import { renderMemeRemix } from './meme-pipeline.js';" js/meme-remix-app.js

      - name: Commit fix
        run: |
          git config user.name "TrendDrop Module Fix"
          git config user.email "actions@github.com"
          git add js/meme-pipeline.js
          git commit -m "Fix Meme Remix module export so UI initializes"
          git push origin HEAD:main
