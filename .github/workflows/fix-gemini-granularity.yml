name: Fix Gemini 8MB upload granularity

on:
  push:
    paths:
      - '.github/workflows/fix-gemini-granularity.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch resumable upload flow
        shell: python
        run: |
          from pathlib import Path
          import json, re

          # Return Gemini's actual chunk granularity from the upload-init response.
          p = Path('api/video-upload-init.js')
          s = p.read_text()
          old = "const uploadToken = crypto.createHmac('sha256', apiKey).update(uploadUrl).digest('hex');\n    return send(res, 200, { configured: true, uploadUrl, uploadToken, displayName });"
          new = "const uploadToken = crypto.createHmac('sha256', apiKey).update(uploadUrl).digest('hex');\n    const reportedGranularity = Number(startRes.headers.get('x-goog-upload-chunk-granularity') || 0);\n    const chunkGranularityBytes = Number.isFinite(reportedGranularity) && reportedGranularity > 0\n      ? reportedGranularity\n      : 8 * 1024 * 1024;\n    return send(res, 200, { configured: true, uploadUrl, uploadToken, displayName, chunkGranularityBytes });"
          if old not in s:
              raise SystemExit('Expected upload-init return block not found')
          p.write_text(s.replace(old, new, 1))

          helper = r'''function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function queryGeminiUpload(uploadUrl, uploadToken) {
            const response = await fetch('/api/video-upload-query', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ uploadUrl, uploadToken }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(data.detail ? `${data.error} (${data.detail})` : (data.error || 'Could not confirm upload progress.'));
            }
            return data;
          }

          async function sendDirectGeminiChunk(uploadUrl, chunk, mimeType, offset, isFinal) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 150000);
            try {
              const response = await fetch(uploadUrl, {
                method: 'POST',
                signal: controller.signal,
                headers: {
                  'Content-Type': mimeType,
                  'X-Goog-Upload-Offset': String(offset),
                  'X-Goog-Upload-Command': isFinal ? 'upload, finalize' : 'upload',
                },
                body: chunk,
              });

              if (response.ok) {
                let data = null;
                if (isFinal) {
                  try { data = await response.json(); } catch {}
                }
                return { responseSeen: true, data };
              }
              return { responseSeen: true, data: null };
            } catch {
              // Gemini accepts the bytes but Firefox may hide the response because
              // Gemini's upload response omits CORS headers. Vercel verifies the
              // accepted byte offset immediately afterwards.
              return { responseSeen: false, data: null };
            } finally {
              clearTimeout(timer);
            }
          }

          async function uploadGeminiFile(uploadUrl, uploadToken, file, mimeType, reportedGranularity) {
            const fallback = 8 * 1024 * 1024;
            const parsed = Number(reportedGranularity);
            const granularity = Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : fallback;
            let offset = 0;

            while (offset < file.size) {
              const remaining = file.size - offset;
              const chunkLength = remaining > granularity ? granularity : remaining;
              const end = offset + chunkLength;
              const isFinal = end >= file.size;
              const chunk = file.slice(offset, end);
              let accepted = false;
              let finalData = null;

              for (let attempt = 0; attempt < 3 && !accepted; attempt++) {
                const direct = await sendDirectGeminiChunk(uploadUrl, chunk, mimeType, offset, isFinal);
                if (direct.data?.file?.uri) return direct.data;
                finalData = direct.data || finalData;

                for (let poll = 0; poll < 12; poll++) {
                  await sleep(poll === 0 ? 180 : 450);
                  const status = await queryGeminiUpload(uploadUrl, uploadToken);
                  const received = Number(status.sizeReceived || 0);
                  if (received >= end || (isFinal && status.status && status.status !== 'active')) {
                    accepted = true;
                    break;
                  }
                  if (received > offset && received < end) {
                    throw new Error(`The AI provider accepted only part of a video chunk (${received - offset} bytes). Please retry the upload.`);
                  }
                }
              }

              if (!accepted) {
                throw new Error(`The AI provider did not confirm video bytes ${offset}-${end}. Please retry.`);
              }

              offset = end;
              if (isFinal) return finalData || {};
            }

            return {};
          }'''

          # Meme Remix.
          p = Path('js/meme-remix-app.js')
          s = p.read_text()
          pattern = r"async function uploadGeminiFile\(uploadUrl, uploadToken, file, mimeType\) \{.*?\n\}\n\nfunction openPicker"
          repl = helper + "\n\nfunction openPicker"
          s2, count = re.subn(pattern, repl, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'meme helper replacement count={count}')
          s2 = s2.replace(
              "uploadGeminiFile(initData.uploadUrl, initData.uploadToken, videoFile, uploadMimeType)",
              "uploadGeminiFile(initData.uploadUrl, initData.uploadToken, videoFile, uploadMimeType, initData.chunkGranularityBytes)",
              1,
          )
          p.write_text(s2)

          # Viral Brain inline JS.
          p = Path('viral-brain.html')
          s = p.read_text()
          helper_inline = '\n'.join(('  ' + line if line else line) for line in helper.splitlines())
          pattern = r"  async function uploadGeminiFile\(uploadUrl, uploadToken, file, mimeType\) \{.*?\n  \}\n\n  function useVideoFile"
          repl = helper_inline + "\n\n  function useVideoFile"
          s2, count = re.subn(pattern, repl, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'viral helper replacement count={count}')
          s2 = s2.replace(
              "uploadGeminiFile(initData.uploadUrl, initData.uploadToken, videoFile, uploadMimeType)",
              "uploadGeminiFile(initData.uploadUrl, initData.uploadToken, videoFile, uploadMimeType, initData.chunkGranularityBytes)",
              1,
          )
          p.write_text(s2)

          # Remove the incompatible 2 MB Vercel body relay. Keep only the tiny query endpoint.
          Path('api/video-upload-chunk.js').unlink(missing_ok=True)
          p = Path('vercel.json')
          cfg = json.loads(p.read_text())
          funcs = cfg.setdefault('functions', {})
          funcs.pop('api/video-upload-chunk.js', None)
          funcs['api/video-upload-query.js'] = {'maxDuration': 20}
          p.write_text(json.dumps(cfg, indent=2) + '\n')

      - name: Verify
        run: |
          node --check api/video-upload-init.js
          node --check api/video-upload-query.js
          node --check js/meme-remix-app.js
          grep -q 'chunkGranularityBytes' api/video-upload-init.js
          grep -q '8 \* 1024 \* 1024' js/meme-remix-app.js
          grep -q '/api/video-upload-query' js/meme-remix-app.js
          grep -q '/api/video-upload-query' viral-brain.html
          grep -q 'chunkGranularityBytes' viral-brain.html
          test ! -e api/video-upload-chunk.js
          ! grep -q 'api/video-upload-chunk.js' vercel.json

      - name: Commit fix
        run: |
          git config user.name "TrendDrop Gemini Upload Fix"
          git config user.email "actions@github.com"
          git add -A api/video-upload-init.js api/video-upload-query.js api/video-upload-chunk.js js/meme-remix-app.js viral-brain.html vercel.json
          git commit -m "Use Gemini 8MB resumable chunks with progress queries"
          git push origin HEAD:main
