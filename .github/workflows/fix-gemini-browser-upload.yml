name: Fix Gemini browser upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gemini-browser-upload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove forbidden Content-Length header from browser uploads
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [Path('viral-brain.html'), Path('js/meme-remix-app.js')]
          for path in targets:
              text = path.read_text()
              before = text
              text = text.replace("          'Content-Length': String(videoFile.size),\n", "")
              text = text.replace("        'Content-Length': String(videoFile.size),\n", "")
              path.write_text(text)
              print(path, 'patched' if text != before else 'already clean')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "TrendDrop Upload Fix"
          git config user.email "actions@github.com"
          git add viral-brain.html js/meme-remix-app.js
          git commit -m "Fix browser video upload NetworkError"
          git push
